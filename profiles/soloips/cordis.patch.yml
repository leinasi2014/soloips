# SoloIPs Profile 部署配置
#
# 本文件是 soloips profile 的部署层 patch。
# 它覆盖 bundle patch + bundles 中的默认配置。
#
# 加载顺序：bundle patches → profile patch → home patch → launcher patch
# 本文件属于 profile patch 层（第二层）。
#
# ⚠️ 环境相关值（storageRoot、host 等）放本文件。
#    产品定义不能依赖绝对路径——这些值由部署时填入。

# ── soloips-core 部署配置 ─────────────────────────────────────────────────

# soloips-core 需要 storageRoot 与 accountId 才能发布服务（fail-closed）。
# ⚠️ 以下为占位值，实际部署时由环境变量或实例配置覆盖。
#
# ⚠️〔约束〕本行**给出 config 即整体替换**产品 patch 的同名行 config
# （bundle patch 记录的 0.1.6 实测语义：省略 config 才保留原值）。因此本行
# **必须列全** `packages/core/cordis.patch.yml` 声明的每一个键——漏一个键，
# 该键在本 profile 部署下就**静默丢失**（不报错、不告警，退回实现的缺省）。
# 该不变量由 `packages/core/tests/assembly-declaration.spec.ts` 的键集比对钉住。
- id: soloips-core
  config:
    enabled: true
    storageRoot: "" # 部署时由 DSH_HOME/profiles/soloips/cordis.patch.yml 或环境变量覆盖
    # 账户绑定（data-contract §3.1 S0 过渡例外）：一个存储根只绑定一个账户。
    # 缺失/空白/"seed" 一律不发布服务。换绑须显式重置或迁移数据根，不得静默改归。
    accountId: "" # 部署时填入真实账户标识（非 "seed"）
    backend: "sqlite"
    # 订阅计划码（data-contract C-1 口径）：free = 1 公司 / 0 子公司，
    # pro = 1 / 3，enterprise = 无限制（-1）。
    # ⚠️ **升计划时改这里**（不是改产品 patch）：本行胜出，产品层的值会被整体替换掉。
    # 缺省 free 是最严格计划，故未覆写的部署不会因本键缺失而放宽限制。
    planCode: "free"

# ── soloips-adapter-dsh 部署配置 ─────────────────────────────────────────────

- id: soloips-adapter-dsh
  config:
    enabled: true
    defaultBackend: "sqlite"
