# SoloIPs core 层 patch
#
# 职责（ARCH-D02 / TERM-17）：SoloIPs 公司、作品、IP、业务绑定与验收的**唯一状态包**，
# 持有业务 domain 的唯一 opener 与写入口。
#
# 本包在 SOLO-C01 顺序中位于 adapter-dsh **之后**、web 之前：
# 它消费 adapter 暴露的内部接口，并被 web 读取投影。

- insert:
    - id: soloips-core
      name: "soloips-core"
      # inject 只声明**必需且由目标组合保证存在**的服务。
      #
      # `soloipsAdapter`：core 的**唯一**宿主依赖面。storage 能力（租约、facility）
      # 由 adapter 收敛后经该服务提供（DEV-04：core 不直接 import 能力包，
      # 因此也不 inject `storageDomain` —— 那会绕过 adapter 的类型层收窄）。
      #
      # 〔约束〕不得写 `storageDomain`：T03 起 core 的写路径只经 adapter 的
      # `SoloipsStoragePort`（lease 先于 stack，facility 显式传入），
      # 契约中不存在 `ctx.storageDomain` 回退（SEAM-X1）。写进 inject 会让本行
      # 依赖一个 core 已不再使用的服务，并把待就绪面扩大到无必要的范围。
      inject: [soloipsAdapter]
      config:
        # 统一开关位；false 时必须在打开任何 domain 之前早退（DEV-06/DEV-08），
        # 本行不发布任何服务。
        enabled: true
        # 已解析的**绝对**存储根。缺失或非绝对路径时 core 不发布服务（fail-closed）。
        # 〔约束〕环境相关值不写死在产品定义里：本字段由部署层（实例 profile 或
        # $DSH_HOME/cordis.patch.yml）覆写为本机实际数据根，见 design.md §5.4/§5.6。
        # 覆写本行时必须**完整重述** config 的全部键（SOLO-C03）。
        storageRoot: ""
        # 部署层注入的账户（S0 过渡例外：config 注入而非 Session 派生，
        # data-contract §3.1）。缺失、空白或为占位值 "seed" 时 core 不发布服务
        # （fail-closed）——账户是根级绑定事实的比对基准，缺省一个「安全默认账户」
        # 会让绑定校验退化成无校验。
        # 〔约束〕环境相关值：与 storageRoot 同规则，由部署层覆写为真实账户标识；
        # 业务命令面**不**承载该值（`SoloipsCreateCompanyInput` 无此字段）。
        accountId: ""
        # 存储后端名（`json` / `sqlite`；可构造性由 adapter 在 `createStack` 校验）。
        # 〔这是**显式覆写**，不是「缺省声明」〕core 只在本键有值时透传给 adapter 的
        # `storage.createStack`（core 侧落点 `packages/core/src/index.ts` 的条件展开）；
        # 未给时由 adapter 的 `defaultBackend` 决定（`SOLOIPS_ADAPTER_CONFIG_DEFAULTS`
        # 当前为 `sqlite`，消费点 `packages/adapter-dsh/src/ports/storage.ts` 的
        # `options.backend ?? config.defaultBackend`）。
        # 即本键与 adapter 的 `defaultBackend` 是同一件事的两层：**本键胜出**。
        # 〔部署层现状〕`profiles/soloips/cordis.patch.yml` 重述本行并给 `sqlite`
        # （该层胜出），故当前部署实际用 SQLite；产品层此处的 `json` 只在**未重述
        # 本行**的部署生效。
        # 〔待决〕产品层是否改为与 adapter 缺省一致（`sqlite`）：改值会让未重述本行
        # 的部署把介质由 JSON 文件换成 SQLite（两种格式不互通、存量数据不自动迁移），
        # 属行为变更，须裁定后再动。
        backend: "json"
        # 订阅计划码（M0.1 形态：部署配置注入，不建 entitlement 表——data-contract
        # C-1 口径）。决定 `createCompany` 的配额：free = 1 公司 / 0 子公司，
        # pro = 1 / 3，enterprise = 无限制（-1）。
        # 〔为什么写 "free" 而不是空初值〕本键**有安全缺省**（free 是最严格计划），
        # 故产品定义给真实值；写空串会让未覆写的部署撞上 SOLOIPS_CORE_CONFIG_INVALID
        # （不发布服务）——那是把「安全缺省」变成「启动失败」。storageRoot/accountId 用
        # "" 是因为它们**没有**安全缺省。
        # 〔与 backend 的差别（勿混同）〕backend 的缺省**不在 core**：core 无值时不透传
        # 该键，由 adapter 的 `defaultBackend` 兜底（见上方本键说明）；且空串 backend 由
        # adapter 以 SOLOIPS_ADAPTER_SERVICE_UNAVAILABLE 拒绝，**不是** core 的
        # CONFIG_INVALID。两者相同之处仅「产品定义给真实值而非空串」。
        # 〔约束〕与环境相关值同规则：升级到 pro/enterprise 的部署须在实例 profile
        # 覆写本键（覆写时完整重述 config 全部键，SOLO-C03）。
        # 〔与实现的一致性〕store.ts 的缺省同为 free（`options.planCode ?? "free"`）；
        # 两处漂移由 tests/assembly-declaration.spec.ts 的键清单断言拦下。
        planCode: "free"
