# SoloIPs web 层 patch
#
# 职责（ARCH-D02 / DEV-10）：可替换视图层；消费 Host 只读投影，零可写业务状态。
#
# 本包在 SOLO-C01 顺序中位于 core **之后**、soloips-bundle 之前。
#
# 【重要】客户端注册不通过本 patch 完成。
# `dsh.client` 是 **package.json 字段**，不是 patch 行字段：client-modules 扫描
# **Loader entries 的包清单**（dsh-client-modules/lib/index.js:104-124 的模块注释），
# 用行名解析到包目录后读其 package.json 的 `dsh.client`。
# 本 patch 只负责让这一行**进入 entry 树**。
#
# 【BE-0b-i 起】`dsh.client` 与 `exports["./client"]` 已在 package.json 就位
# （客户端实现见 `src/client/index.ts`，产物 `lib/client.js`）：
# client-modules 现在能把本行认成**动态行**并把它下发给页面。
# 未声明该字段时会被安全跳过（`parseDshClient` 返回 undefined → 记 null 返回）；
# 声明了却没有 `exports["./client"]` 则**抛错**
# （`declares dsh.client but exports no "./client" bundle`，src/index.ts:790-793）。
# 后一条由根 `tsdown.config.ts` 的 `client-artifact-contract` 门在**构建期**镜像，
# 使「声明了却没有产物」在本仓即可判定失败。

- insert:
    - id: soloips-web
      name: "soloips-web"
      # 无 inject：Host 半边是纯投影消费者，方法体内**按调用**经 `coreOf(this.ctx)`
      # 解析 `soloipsCore`（`src/index.ts:224-227`），未就绪时返回 `unavailable` 态
      # 而不是让本行 pending（§2.5.1 裁定三：不伪装空数据）。
      #
      # 〔约束〕不得把 `soloipsCore` 写进本行 inject：
      #   - **不必要**——`ctx.get` 走 isolate map + store 直查，**不读** `fiber.inject`
      #     （`@deepseek-ai/cordis/lib/index.js:762-771`，其 docstring 明写
      #     "without the inject requirement"）。读 `fiber.inject` 的是**属性访问**
      #     路径（`ctx.soloipsCore`，同文件 :683-693），本包不用属性访问取 core。
      #   - **有害**——写进 inject 会让本行在 core 就绪前保持 pending，连 `getStatus`
      #     探针都不可用；且 core 被 disabled 时整个 web 行不激活，而本包的业务面
      #     本可降级返回 `unavailable`（fail-soft 于本行，fail-closed 于调用）。
      #
      # 〔实测，2026-09-19 摘除对照〕在隔离实例上显式把本行 inject 置空后重跑真实
      # 浏览器 E2E：`createCompany → committed`、读回 `ok`、刷新后读回 `ok`——
      # **全绿**。即业务面可用性与本行 inject **无因果**。
      # 〔同时修正的历史误判〕先前曾把某次 `core-unavailable` 归因于「inject 缺位」
      # 并补上本声明；后经读源 + 摘除对照证实该归因错误——当时的真因是 **core 的
      # 异步 open 尚未完成**（`_getImpl` 的 `strict && impl.fiber.state !== 2` 返回
      # undefined），叠加 force-kill 残留的孤儿 lease 锁延长了 open 等待。该错误
      # 修复已撤销（见本行现状）。
      #
      # 客户端半边与本行无关：`dsh.client` 是 package.json 字段（见文件头），
      # 浏览器内按 `dsh.client.inject` 排序，不由行 inject 驱动。
      config:
        # 统一开关位；false 时 Host 桥不注册任何路由/投影。
        enabled: true
        # 是否注册客户端 UI 扩展点。BE-0b-i 起为 **true**：`src/client/index.ts`
        # 与 package.json 的 `dsh.client` 已交付，浏览器半边会把生成的 Remote
        # 贡献 `$mount` 到 `ctx.remote`。
        #
        # 〔实测边界〕本键目前**不被本包实现读取**：`SoloipsWebHost` 未声明 Config
        # schema，`apply()` 也不读 config——浏览器半边的注册实际由 package.json 的
        # `dsh.client` 驱动（client-modules 的扫描路径），不由本键驱动。
        # 保留它是**装配意图的显式声明**（与 `enabled` 同层），不是运行开关；
        # 显式写 true 而不删键：删键会让将来读它的实现落到默认值，等于靠默认值赌行为。
        # 待 BE-6 把 Host 半边的路由/投影接进来时，本键应连同 enabled 一起被真正消费。
        registerClient: true
