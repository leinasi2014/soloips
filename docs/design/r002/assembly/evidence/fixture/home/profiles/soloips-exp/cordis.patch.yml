# 机制探针 profile 层（不是产品 profile）
# 目的：验证 0.1.6-alpha.1 的 config 整体替换与 insert 未命中告警。
#
# 形状契约（本探针第 1 次运行已实测）：`insert` 必须是顶层 YAML **数组**，
# 与 `id` 同级（`- id: <group-id>` + `insert: [...]`）。
# 把 `insert` 写成映射会在 parsePatchList 阶段抛
# TypeError: patch.insert?.forEach is not a function，整个 profile 加载失败。

# 1) config 整体替换探针：官方 dsh-web-app 给 system-prompt 写了
#    personaSuffix + personaPrefix 两个键。这里只写一个键，观察另一个是否被静默删除。
- id: system-prompt
  config:
    personaPrefix: PROBE_ONLY_PREFIX

# 2) insert 到一个不存在的 group id：预期 warn 后跳过，不抛错。
- id: soloips-probe-missing-group
  insert:
    - id: soloips-probe-row
      name: '@deepseek-ai/dsh-tool-todo'
