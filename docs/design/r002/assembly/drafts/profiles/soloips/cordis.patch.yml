# SoloIPs profile 用户层 patch（草案）
#
# 目标路径：profiles/soloips/cordis.patch.yml
#
# 层位置：本文件在 bundle 层**之后**、home 层与 --patch 覆盖层之前生效
# （0.1.6 实测 allPatches 顺序 = bundlePatches → profile.patches → homePatches → overlays）。
# 因此本层可以覆写任何 bundle 层已插入的行。
#
# ── 本层的写权边界（重要，见 design.md §5.6）──────────────────────────────────
#
# 本层**只放部署/环境相关值**，不放产品级策略。
# 理由：本文件随实例走；产品定义必须与环境无关（DEV-02「交付定义不包含机器绝对路径」）。
#
# 官方行的覆写按**性质**分配写者，同一个 row id 不出现两个写者（SOLO-C04 单写者原则）：
#
#   | 覆写性质 | 写者 | 例子 |
#   | --- | --- | --- |
#   | 产品级语义（所有部署一致） | `soloips-bundle` | `llm-retry` 关闭、遥测关闭 |
#   | 部署级取值（每实例不同） | **本层** | `webserver` 的 host/port、`connection` 的 trustedHosts |
#
# 因此**本层刻意不重复** `llm-retry` / `session-telemetry-otel` 的 disabled 声明
# ——它们已在 `packages/bundle/cordis.patch.yml` 声明，属产品级策略。
# （重复声明的害处：制造第二个写者，且同值覆写在 dump 中不显示 `patched by`，
#   无法从证据上区分"确实声明了"与"根本没生效"——见 design.md §6.6 盲区 M1。）
#
# ── SOLO-C03 硬约束（必读）────────────────────────────────────────────────────
#
# 本层覆写任何带 config 的行，必须**完整重述该行全部 config 键**。
# 只写差异键会静默删除其余键 —— 本机已实测（探针 P0：官方 web-app 给 system-prompt 的
# personaSuffix 在本层只写 personaPrefix 时被静默丢弃，且无任何 warning）。
#
# 每个候选目标的完整键清单见 design.md §4 与 evidence/official-rows.txt。
# 覆写前必须先在 L2 dump 上核对目标行的**当前**键集合（可能已被其他层改过）。
#
# ── 启动语义提醒 ──────────────────────────────────────────────────────────────
#
# `patchReload: startup` 是 **package.json 的 manifest 字段**，不在本文件表达。
# 本 profile 已在 package.json 中**显式**写该字段。
# 自定义 profile 的默认值是 `live`（W0 SOLO-C05），而 0.1.6 的 live 失败**完全静默**
# （仅 logger.warn，无事件、无退出码，W0 MECH-10）—— 不要为了省事删掉显式声明。

# ── 部署级覆写（按实例填写；下列为形状示范，全部注释掉）────────────────────────
#
# 【形状规则】每个条目都**完整重述**该行的全部 config 键 —— 这是 SOLO-C03 的强制要求。
# 落地时按实际 home/端口填写；值来自环境交接（ENV-03 / SOLO-DATA-02），不写死在本仓库。

# 监听地址与端口。
# 完整键：host, port, compression, compressionLevel, compressionThresholdBytes
# 注意：`!!js` 表达式在 dump 中原样输出、不求值（盲区 M5），故此处直接写字面值。
#
# - id: webserver
#   name: '@deepseek-ai/dsh-host-webserver'
#   inject: [webStartup]
#   config:
#     host: '127.0.0.1'
#     port: 55202
#     compression: gzip
#     compressionLevel: 1
#     compressionThresholdBytes: 1024
#
# Web 运行期开关。
# 完整键：openBrowser, printUrl, surfaceContext, trustedHosts
#
# - id: web-runtime
#   name: '@deepseek-ai/dsh-web-app'
#   inject: [webStartup]
#   config:
#     openBrowser: false
#     printUrl: true
#     surfaceContext: true
#     trustedHosts: []
#
# 信任域（LAN 访问时才有意义）。
# 完整键：trustedHosts
# 保留官方表达式可继承运行时推导值；若改为字面量数组，须自行维护完整清单。
#
# - id: connection
#   name: '@deepseek-ai/dsh-client-connection'
#   inject: [webRuntime]
#   config:
#     trustedHosts: !!js ctx.webRuntime.trustedHosts
