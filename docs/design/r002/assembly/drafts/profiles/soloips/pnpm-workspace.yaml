# SoloIPs 交付 profile 的 pnpm 安装上下文（草案）
#
# 目标路径：profiles/soloips/pnpm-workspace.yaml
#
# 这两项是 DSH 启动器 initProfile 生成的默认值
# （0.1.6 实测：packages/boot/app-boot/src/profile.ts 的 PROFILE_PNPM_WORKSPACE 常量，
#  内容为 `packages:\n  - .\n\nnodeLinker: hoisted\nautoInstallPeers: false`）。
# 与生成值保持一致，使「版本控制内的定义」与「实例实际初始化结果」可直接比对。
#
# 为何必须入 git（SOLO-C05）：profile 是**独立安装上下文**，本文件决定 pnpm 的
# 链接行为与 allowBuilds 策略；缺失时实例会用启动器默认值，定义与实际可能静默分叉。
packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false
