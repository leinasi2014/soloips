# SoloIPs 文档注册表
#
# 本表登记文档角色、负责人、变更触发与验证入口。
# 格式约束：两空格缩进映射；文档条目以 "  - documentId:" 引导；标量治理字段缩进四空格。
# 本表是文档身份与归属的唯一权威；各文档不得重复抄写负责人与路径。
# sourceAuthority 为直接来源的 documentId 列表；来源变化时由维护者复核投影，本表不提供自动刷新程序。
# relatedPaths 与该条目共用角色、负责人和变更权；每个路径只登记一次。
# validation 描述适用检查，不是通过回执；none-yet 表示尚未指定入口。实际结果按运维交接保留候选与命令证据。

schemaVersion: 1
project: soloips
layoutPolicy: adapt-existing
legalRoles: stable-authority|dynamic-authority|evidence|projection|reference

