# PR 门禁：verify（Ubuntu 平台，主检查）+ windows-verify（辅助）
name: verify

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 主检查：匹配 branch protection 的 "verify" 要求
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # M-A 证据门用 `git diff <base>...HEAD` 判定是否触及 M-A 写面，
          # 需要 base ref 的提交对象——浅克隆（默认 fetch-depth: 1）取不到。
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # 产物行为套件（BE-0b-ii / F-03）：**必须在 build 之后**。
      #
      # 为什么必须是独立步骤：上面的 `Test` 步骤跑在 `build` **之前**，此时
      # `lib/` 下只有 tsc 的声明面，tsdown 产物（`lib/client.js` / `lib/index.js` /
      # `lib/typert.*.js`）**还不存在**。因此默认套件里的产物断言只能写成条件检查
      # （`if (!hasArtifact) return`），那等于「产物行为测试从未在 CI 上执行」。
      # `check:build-repro` 也补不上这个洞：它是「删产物 → 重建 → 字节比对」，
      # **不执行** VM / 挂载 / codec 断言，而字节可复现 ≠ 产物可用。
      #
      # 本步骤跑 `packages/web/vitest.artifacts.config.ts`（include 只匹配
      # `tests/artifacts/*.artifact.ts`，与默认套件不相交），要求产物存在、
      # 真执行产物行为断言，并由 ArtifactSuiteGuard 核对「必需用例真的执行过」。
      - name: Artifact behavior tests
        run: pnpm run test:artifacts

      # 生成物可复现（BE-0a）：删生成物 → 重跑构建 → 逐文件比对 SHA-256。
      #
      # 为什么必须放在 CI 而不只在本地：本门禁是**唯一**检查 Typert 产物
      # 有效性/可复现的地方。默认测试套件（vitest）跑在 `build` **之前**
      # （见上面的 Test 步骤顺序），此时 `lib/` 还不存在，故
      # `packages/web/tests/typert-artifacts.spec.ts` 的产物断言在 CI 上
      # 只能做「无部分生成」这类条件检查——产物有效性的硬检查由本步骤承担。
      # 变异测试证明：只把门禁写进测试接线（spec 断言脚本存在）而 CI 不跑它，
      # 等于 CI 永远不验证产物。
      - name: Build reproducibility check
        run: pnpm run check:build-repro

      - name: Delivery load check
        run: pnpm run check:delivery-load

      # M-A 真实消费者证据门（P0-2，裁定六）：**fail-closed**。
      #
      # 为什么不是「在 CI 上跑 E2E」：真实链路需要 DSH fork 运行时，它只存在于
      # 开发机的实例目录（本仓 node_modules 只有 typert-generator/protocol，
      # 根 package.json 无 fork 依赖，无内网源 .npmrc）。在 hosted runner 上跑
      # E2E 不可能——写成 CI 步骤只会得到跳过或假绿。
      #
      # 本步骤检查的是「**证据是否与候选绑定**」：改动触及 M-A 写面
      # （packages/web/src、web 装配行、构建入口、bundle、adapter 端口）时，
      # docs/evidence/be6a/CANDIDATE-MANIFEST.json 必须存在、candidateSha 与
      # HEAD 相等、artifactSha256 与 packages/web/lib/client.js 实际摘要相等，
      # 且报告内 artifactIdentity.embedded === true、无 failure 字段。
      # 找不到 → **红**（不是跳过）——「证据缺失即显性失败」。
      #
      # 必须放在 Build 之后：本步骤要读 packages/web/lib/client.js 算摘要。
      # 需要 base ref 的提交对象：本 job 的 checkout 已配 fetch-depth: 0。
      - name: M-A evidence gate
        run: pnpm run check:m-a-evidence -- --base "origin/${{ github.base_ref || 'main' }}"

  # Windows 辅助检查（不阻塞合并）
  windows:
    name: windows-verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # better-sqlite3 对 Node 24 无预编译二进制需源码编译，node-gyp 在 runner
      # 上探测不到 VS；改用 Node 22（有 prebuild，免编译）+ MSVC 注入双保险
      - name: Setup MSVC for node-gyp
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # 与主检查同一理由（见 verify job 内该步骤的注释）：产物行为断言必须在
      # build **之后**执行，否则它们要么被条件跳过、要么因缺产物而红。
      - name: Artifact behavior tests
        run: pnpm run test:artifacts

      # 与主检查同一理由（见 verify job 内该步骤的注释）：产物有效性/可复现的
      # 硬检查只在 CI 的这一步发生。
      - name: Build reproducibility check
        run: pnpm run check:build-repro

      - name: Delivery load check
        run: pnpm run check:delivery-load
        env:
          TMPDIR: ${{ runner.temp }}
