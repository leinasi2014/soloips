# PR 门禁：verify（Ubuntu 平台，主检查）+ windows-verify（辅助）
name: verify

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 主检查：匹配 branch protection 的 "verify" 要求
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Delivery load check
        run: pnpm run check:delivery-load

  # Windows 辅助检查（不阻塞合并）
  windows:
    name: windows-verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # better-sqlite3 对 Node 24 无预编译二进制需源码编译，node-gyp 在 runner
      # 上探测不到 VS；改用 Node 22（有 prebuild，免编译）+ MSVC 注入双保险
      - name: Setup MSVC for node-gyp
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Delivery load check
        run: pnpm run check:delivery-load
        env:
          TMPDIR: ${{ runner.temp }}
