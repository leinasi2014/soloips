# PR 门禁：verify（Ubuntu 平台，主检查）+ windows-verify（辅助）
name: verify

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 主检查：匹配 branch protection 的 "verify" 要求
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # 生成物可复现（BE-0a）：删生成物 → 重跑构建 → 逐文件比对 SHA-256。
      #
      # 为什么必须放在 CI 而不只在本地：本门禁是**唯一**检查 Typert 产物
      # 有效性/可复现的地方。默认测试套件（vitest）跑在 `build` **之前**
      # （见上面的 Test 步骤顺序），此时 `lib/` 还不存在，故
      # `packages/web/tests/typert-artifacts.spec.ts` 的产物断言在 CI 上
      # 只能做「无部分生成」这类条件检查——产物有效性的硬检查由本步骤承担。
      # 变异测试证明：只把门禁写进测试接线（spec 断言脚本存在）而 CI 不跑它，
      # 等于 CI 永远不验证产物。
      - name: Build reproducibility check
        run: pnpm run check:build-repro

      - name: Delivery load check
        run: pnpm run check:delivery-load

  # Windows 辅助检查（不阻塞合并）
  windows:
    name: windows-verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # better-sqlite3 对 Node 24 无预编译二进制需源码编译，node-gyp 在 runner
      # 上探测不到 VS；改用 Node 22（有 prebuild，免编译）+ MSVC 注入双保险
      - name: Setup MSVC for node-gyp
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # 与主检查同一理由（见 verify job 内该步骤的注释）：产物有效性/可复现的
      # 硬检查只在 CI 的这一步发生。
      - name: Build reproducibility check
        run: pnpm run check:build-repro

      - name: Delivery load check
        run: pnpm run check:delivery-load
        env:
          TMPDIR: ${{ runner.temp }}
